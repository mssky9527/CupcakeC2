# Cupcake C2 monorepo — minimal multi-stack CI
# Jobs: go-server (ubuntu), release-artifacts (ubuntu), rust-client (windows),
#       frontend (ubuntu), mcp-python (ubuntu)
# No secrets. Caches go modules / cargo / npm where easy.

name: CI

on:
  push:
    branches: [main, master, "0.0.5"]
  pull_request:
    branches: [main, master, "0.0.5"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go server unit tests + vet ───────────────────────────────────────────
  go-server:
    name: go-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod requires go 1.25.x (see server/go.mod)
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      # -tags nodonut: skip go-donut-linked tests (AV-noisy / PE conversion).
      # Prefer daily path documented in services/fileless_donut_test.go.
      - name: go test
        run: go test -tags nodonut ./... -count=1 -timeout 5m

  # ── Linux server binary + checksum + lightweight module SBOM ─────────────
  # Runs after go-server so broken tests never produce release-like artifacts.
  release-artifacts:
    name: release-artifacts
    runs-on: ubuntu-latest
    needs: [go-server]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build cupcake-server (linux)
        run: go build -o cupcake-server ./

      - name: SHA-256 checksum
        run: sha256sum cupcake-server > cupcake-server.sha256

      # Lightweight SBOM substitute (no syft install): module graph + its digest.
      - name: Go module inventory
        run: |
          go list -m all > go-modules.txt
          sha256sum go-modules.txt > go-modules.txt.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cupcake-server-linux
          path: |
            server/cupcake-server
            server/cupcake-server.sha256
            server/go-modules.txt
            server/go-modules.txt.sha256
          if-no-files-found: error
          retention-days: 14

  # ── Rust Stage0 client (Windows-only product path) ───────────────────────
  # Client/core is heavily cfg(windows) (winapi, syscalls, job objects, PE map).
  # Prefer windows-latest so --features minimal --lib matches product docs.
  rust-client:
    name: rust-client
    runs-on: windows-latest
    # Product Stage0 is Windows-first (winapi, syscalls, Job Objects, PE map).
    # Workspace root is Client/; package is cupcake-core (Client/core).
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Client

      - name: cargo test (minimal lib)
        # Matches docs/SECURITY_HARDENING.md / CLIENT_SIZE_PROFILES.md product gate.
        # default features already include ws+minimal; --features minimal kept explicit.
        run: cargo test -p cupcake-core --features minimal --lib -- --quiet
        env:
          CARGO_TERM_COLOR: always
        timeout-minutes: 30

      # First-version scaffold: clippy often noisy on Windows OPSEC code; non-blocking.
      - name: cargo clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy -p cupcake-core --features minimal --lib -- -D warnings
        env:
          CARGO_TERM_COLOR: always
        timeout-minutes: 20

  # ── Vue/Vite admin frontend ──────────────────────────────────────────────
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend-v2/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

  # ── MCP Python client (syntax-only; no secrets / live server) ────────────
  mcp-python:
    name: mcp-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MCPClient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pytest suite yet; syntax-check only (py_compile does not import deps).
      - name: Syntax check
        run: python -m py_compile client.py command_guard.py
