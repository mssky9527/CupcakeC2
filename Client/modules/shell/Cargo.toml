[package]
name = "cupcake-mod-shell"
version = "0.1.0"
edition = "2021"
description = "L2 shell module for Cupcake Stage0 (hybrid builtins + direct spawn)"

[lib]
name = "cupcake_mod_shell"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# Shared hybrid executor from core (no transport / monolith extras)
cupcake-core = { path = "../../core", default-features = false, features = ["post-ex", "encoding-support"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "io-util", "process", "time", "sync"] }
log = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "minwinbase"] }
