[package]
name = "cupcake-mod-desktop"
version = "0.1.0"
edition = "2021"
description = "L2 desktop module (C ABI packaging for mem-map; engine lives in cupcake-core feature desktop)"

[lib]
name = "cupcake_mod_desktop"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
cupcake-core = { path = "../../core", default-features = false, features = ["desktop"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
