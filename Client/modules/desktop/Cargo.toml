[package]
name = "cupcake-mod-desktop"
version = "0.1.0"
edition = "2021"
description = "L2 remote-desktop capability module — gates RDP (3389) port-forward; no GDI capture"

[lib]
name = "cupcake_mod_desktop"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
serde_json = { version = "1.0", default-features = false, features = ["std"] }
