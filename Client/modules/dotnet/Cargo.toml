[package]
name = "cupcake-mod-dotnet"
version = "0.1.0"
edition = "2021"
description = "L2 .NET module — on-demand in-memory assembly (stealth-oriented CLR host)"

[lib]
name = "cupcake_mod_dotnet"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
cupcake-core = { path = "../../core", default-features = false, features = ["dotnet"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
base64 = { version = "0.21", default-features = false, features = ["std"] }
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "time"] }
log = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "oleauto", "unknwnbase", "wtypes", "objbase"] }
