[package]
name = "cupcake-mod-inject"
version = "0.1.0"
edition = "2021"
description = "L2 process inject module — remote shellcode via PEB/Nt (on-demand only)"

[lib]
name = "cupcake_mod_inject"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# Only inject surface from core — no transport / Stage0 monolith
cupcake-core = { path = "../../core", default-features = false, features = ["inject"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
base64 = { version = "0.21", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "memoryapi"] }
