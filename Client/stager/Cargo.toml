[package]
name = "cupcake-stager"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winnt", "processthreadsapi", "memoryapi", "handleapi", 
    "errhandlingapi", "winbase", "debugapi", "minwinbase"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
