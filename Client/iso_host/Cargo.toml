[package]
name = "cupcake-iso-host"
version = "0.1.0"
edition = "2021"
description = "Short-lived sacrificial host for isolated BOF/.NET (PPID-spoofed child)"

[[bin]]
name = "cupcake-iso-host"
path = "src/main.rs"

[dependencies]
# inject: KIND_INJECT_JSON jobs run in this process only (never in Stage0 agent)
cupcake-core = { path = "../core", default-features = false, features = ["bof", "dotnet", "inject"] }
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "io-util", "time"] }
base64 = { version = "0.21", default-features = false, features = ["std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
