[package]
name = "cupcake-desktop-worker"
version = "0.1.0"
edition = "2021"
description = "Long-lived RDP dial+relay worker (Job Object child; opt-in via CUPCAKE_DESKTOP_WORKER=1)"

[[bin]]
name = "cupcake-desktop-worker"
path = "src/main.rs"

[dependencies]
# Intentionally minimal: std only (TCP dial + stdin/stdout duplex).
# Do not pull cupcake-core — keeps Stage0 / worker dependency boundary clear.

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
